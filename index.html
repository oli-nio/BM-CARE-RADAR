<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BM Care Radar</title><style>body{font:16px system-ui;margin:0;background:#f5f1eb;color:#20252a}header,main{padding:24px max(18px,5vw)}header{background:white;border-bottom:1px solid #ddd}h1{font-size:42px;margin:0}.tabs button,button{padding:10px 16px;border:1px solid #ccc;border-radius:30px;background:white;margin:4px;cursor:pointer}.tabs .on,.primary{background:#20252a;color:white}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card,.q{background:white;border:1px solid #ddd;border-radius:16px;padding:18px}.q{margin:10px 0}.scale{display:flex;gap:8px}.scale label{flex:1;text-align:center;border:1px solid #ddd;border-radius:9px;padding:8px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{margin-top:14px;padding:16px;border:1px solid #ddd;border-radius:14px;background:white;min-height:105px}.detail small{color:#66717b}.detail h2{margin:4px 0 6px;font-size:20px}.detail p{margin:0;color:#66717b;line-height:1.4}.score{padding:9px;border-left:5px solid #777;background:white}.score b{display:block;font-size:12px}.score span{font-size:22px;font-weight:bold}svg{width:100%;height:auto}#survey>.card{position:sticky;top:12px;z-index:20;box-shadow:0 6px 20px #00000014;margin-bottom:18px}.bar{height:8px;background:#ddd;border-radius:8px}.bar i{display:block;height:100%;background:#20252a}@media(max-width:750px){.grid{grid-template-columns:1fr}.scores{grid-template-columns:1fr}}</style><header><h1>CARE RADAR</h1><p>Interaktiver Prototyp · 12 Dimensionen × 5 Fragen · Skala 1–5</p><div class="tabs"><button class="on" data-v="radar">Radar & Auswertung</button><button data-v="survey">Fragebogen</button></div></header><main><section id="radar" class="view on"><div class="grid"><div class="card"><svg id="chart" viewBox="0 0 700 700"></svg><div id="detail" class="detail" aria-live="polite"><small>Dimension antippen</small><h2>A1 · Faire & sichere Beschäftigung</h2><p>Tippe auf A1–D3 im Diagramm, um Details zu sehen.</p></div></div><div><div class="scores" id="scores"></div><button class="primary" id="start">Fragen beantworten</button><button id="reset">Zurücksetzen</button></div></div></section><section id="survey" class="view"><div class="card"><b>Fortschritt</b><div class="bar"><i id="bar"></i></div><span id="prog"></span></div><form id="form"></form><button type="button" class="primary" id="result">Auswertung ansehen</button></section></main><script>const D=[["A1","Faire & sichere Beschäftigung",["Vergütung ist angemessen.","Verträge sind transparent und verlässlich.","Soziale Absicherung wird berücksichtigt.","Vergütungsentscheidungen sind fair.","Mehrarbeit wird vermieden oder ausgeglichen."]],["A2","Arbeitszeit & Planbarkeit",["Arbeitszeiten sind früh bekannt.","Pläne werden grundsätzlich eingehalten.","Kurzfristige Änderungen sind Ausnahmen.","Individuelle Zeitbedarfe werden berücksichtigt.","Abend- und Wochenendarbeit wird fair organisiert."]],["A3","Arbeitsbelastung & Ressourcen",["Arbeitsmenge ist realistisch.","Personalausstattung ist ausreichend.","Pausen können genommen werden.","Dauerhafte Überlastung wird vermieden.","Nötige Ressourcen stehen zur Verfügung."]],["B1","Vereinbarkeit & Sorgearbeit",["Sorgeverantwortung wird anerkannt.","Betreuungsbedarfe können eingebracht werden.","Elternschaft oder Pflege führen nicht zu Nachteilen.","Wiedereinstieg wird unterstützt.","Teilzeit und Jobsharing sind möglich."]],["B2","Gesundheit & Regeneration",["Psychische Gesundheit wird ernst genommen.","Körperlicher Arbeitsschutz funktioniert.","Regeneration ist möglich.","Gesundheitliche Unterstützung ist verfügbar.","Rückzug und Erholung werden akzeptiert."]],["B3","Barrierefreiheit & individuelle Bedarfe",["Arbeitsorte sind zugänglich.","Kommunikation ist barrierearm.","Individuelle Anpassungen sind möglich.","Neurodiverse und sensorische Bedarfe werden berücksichtigt.","Bedarfe müssen nicht ständig gerechtfertigt werden."]],["C1","Schutz, Awareness & Konflikte",["Vertrauenspersonen sind bekannt.","Beschwerdewege sind klar und unabhängig.","Beschwerden führen nicht zu Nachteilen.","Grenzverletzungen werden konsequent bearbeitet.","Konflikte werden professionell begleitet."]],["C2","Diversität & Antidiskriminierung",["Prozesse sind diskriminierungssensibel.","Unterschiedliche Lebensrealitäten werden respektiert.","Strukturelle Benachteiligung wird bearbeitet.","Chancen und Ressourcen sind fair zugänglich.","Diversität prägt tatsächliche Entscheidungen."]],["C3","Führung, Macht & Verantwortung",["Führung geht verantwortlich mit Macht um.","Entscheidungen werden respektvoll vermittelt.","Kritik ist ohne Angst möglich.","Führung übernimmt Verantwortung.","Hierarchien verhindern Widerspruch nicht."]],["D1","Kommunikation & Transparenz",["Informationen kommen rechtzeitig.","Entscheidungen werden erklärt.","Rollen und Erwartungen sind klar.","Feedback ist konstruktiv.","Informationen sind gut zugänglich."]],["D2","Mitbestimmung & Selbstwirksamkeit",["Ich kann relevante Entscheidungen beeinflussen.","Mitsprache ist nicht nur symbolisch.","Ich habe Gestaltungsspielraum.","Feedback kann Veränderungen bewirken.","Beschäftigtengruppen werden einbezogen."]],["D3","Entwicklung, Anerkennung & Zugehörigkeit",["Weiterbildung ist zugänglich.","Potenziale werden gefördert.","Arbeit wird wertgeschätzt.","Kollegiale Zugehörigkeit ist spürbar.","Entwicklungschancen sind fair."]]];let S={};try{S=JSON.parse(localStorage.careRadar||"{}")}catch(e){}function avg(d){let a=d[2].map((_,i)=>+S[d[0]+"-"+i]).filter(Boolean);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function save(){localStorage.careRadar=JSON.stringify(S)}function form(){let f=document.querySelector("#form");f.innerHTML="";D.forEach(d=>{let s=document.createElement("section");s.innerHTML="<h2>"+d[0]+" · "+d[1]+"</h2>";d[2].forEach((q,i)=>{let k=d[0]+"-"+i;s.innerHTML+='<div class="q"><p><b>'+d[0]+"."+(i+1)+"</b> "+q+'</p><div class="scale">'+[1,2,3,4,5].map(v=>'<label><input type="radio" name="'+k+'" value="'+v+'" '+(S[k]==v?"checked":"")+'> '+v+"</label>").join("")+"</div></div>"});f.appendChild(s)});f.querySelectorAll("input").forEach(x=>x.onchange=e=>{S[e.target.name]=e.target.value;save();draw()})}function draw(){let n=D.length,cx=350,cy=350,R=245,svg=document.querySelector("#chart"),z="";for(let l=1;l<=5;l++){let p=D.map((_,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,r=R*l/5;return(cx+Math.cos(a)*r)+","+(cy+Math.sin(a)*r)}).join(" ");z+='<polygon points="'+p+'" fill="none" stroke="#d8d2ca"/>'}D.forEach((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R,lx=cx+Math.cos(a)*(R+42),ly=cy+Math.sin(a)*(R+42);z+='<line x1="350" y1="350" x2="'+x+'" y2="'+y+'" stroke="#ddd"/><text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="14" font-weight="bold">'+d[0]+"</text>"});let p=D.map((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,r=R*(avg(d)||3)/5;return(cx+Math.cos(a)*r)+","+(cy+Math.sin(a)*r)}).join(" ");z+='<polygon points="'+p+'" fill="#668aa544" stroke="#405d73" stroke-width="4"/>';svg.innerHTML=z;svg.style.cursor="pointer";svg.onclick=function(e){let r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*700/r.width,y=(e.clientY-r.top)*700/r.height,best=0,dist=1e9;D.forEach((d,i)=>{let a=-Math.PI/2+i*2*Math.PI/D.length,lx=350+Math.cos(a)*287,ly=350+Math.sin(a)*287,dd=(x-lx)*(x-lx)+(y-ly)*(y-ly);if(dd<dist){dist=dd;best=i}});if(dist<5000){let d=D[best],v=avg(d),el=document.querySelector("#detail");el.innerHTML="<small>Ausgewählte Dimension · "+d[0]+"</small><h2>"+d[0]+" · "+d[1]+"</h2><p>"+(v?"Aktuelle Bewertung: <b>"+v.toFixed(1)+" / 5</b>":"Noch keine Bewertung für diese Dimension.")+"</p>"}};document.querySelector("#scores").innerHTML=D.map(d=>'<div class="score"><b>'+d[0]+" · "+d[1]+'</b><span>'+(avg(d)?.toFixed(1)||"–")+"</span> / 5</div>").join("");let a=Object.keys(S).length;document.querySelector("#bar").style.width=a/60*100+"%";document.querySelector("#prog").textContent=a+" von 60 beantwortet"}function show(id){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==id));document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v==id));scrollTo(0,0)}document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));document.querySelector("#start").onclick=()=>show("survey");document.querySelector("#result").onclick=()=>show("radar");document.querySelector("#reset").onclick=()=>{if(confirm("Alle Antworten zurücksetzen?")){S={};save();form();draw()}};form();draw();</script>
